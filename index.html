<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amazon PPC Campaign Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Amazon PPC Campaign Tracker</h1>
    <p>Track campaigns, keyword sheets, reminders, and optimization history locally.</p>
  </header>

  <main>
    <section class="card">
      <h2>Add Campaign</h2>
      <form id="campaign-form">
        <div class="grid">
          <label>Campaign Name
            <input type="text" id="campaignName" required />
          </label>
          <label>Created Date
            <input type="date" id="createdDate" required />
          </label>
          <label>Ad Type
            <input type="text" id="adType" placeholder="Sponsored Products" required />
          </label>
          <label>Match Type
            <input type="text" id="matchType" placeholder="Broad / Phrase / Exact" required />
          </label>
          <label>Category
            <input type="text" id="category" required />
          </label>
          <label>Budget
            <input type="number" id="budget" min="0" step="0.01" required />
          </label>
          <label>Placements
            <input type="text" id="placements" placeholder="Top of Search, Product Pages" required />
          </label>
          <label class="full">Model ASIN List (comma separated)
            <textarea id="asinList" rows="2" placeholder="B08XXXXXX, B09YYYYYY" required></textarea>
          </label>
        </div>

        <div class="actions">
          <label>Optimization Reminder (days from creation)
            <input type="number" id="reminderDays" min="1" value="7" required />
          </label>
          <button type="submit">Save Campaign</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="section-header">
        <h2>Campaigns</h2>
        <button id="clear-data" class="danger">Clear All Data</button>
      </div>
      <div id="campaign-list"></div>
    </section>
  </main>

  <dialog id="keyword-dialog">
    <form method="dialog" class="dialog-content" id="keyword-form">
      <div class="section-header">
        <h3>Keyword Sheet</h3>
        <button type="submit" class="link">Close</button>
      </div>
      <p class="hint">Enter one keyword per line (Excel style).</p>
      <textarea id="keyword-text" rows="14" placeholder="keyword one&#10;keyword two"></textarea>
      <menu>
        <button id="save-keywords" value="default">Save Keywords</button>
      </menu>
    </form>
  </dialog>

  <template id="campaign-template">
    <article class="campaign-item">
      <div class="section-header">
        <h3 class="campaign-title"></h3>
        <div class="item-actions">
          <button class="secondary keyword-btn">Keyword Tab</button>
          <button class="secondary edit-btn">Edit</button>
        </div>
      </div>
      <div class="meta"></div>
      <div class="reminder"></div>

      <details>
        <summary>Optimization History</summary>
        <ul class="history-list"></ul>
        <div class="history-add">
          <label>Add optimization date
            <input type="date" class="optimization-date" />
          </label>
          <button class="secondary add-history">Add Date</button>
        </div>
      </details>
    </article>
  </template>

  <script src="script.js"></script>
</body>
</html>
